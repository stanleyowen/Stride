name: Stride
options:
  bundleIdPrefix: com.stanleyowen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""   # set your Apple Team ID here (needed for a real device + HealthKit)
packages:
  StrideCore:
    path: StrideCore
targets:
  Stride:
    type: application
    platform: iOS
    sources: [Stride]
    dependencies:
      - package: StrideCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stanleyowen.stride
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Stride/Info.plist
      properties:
        CFBundleDisplayName: Stride
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Stride reads your workouts, routes and heart rate from Apple Health to build your activity feed.
    entitlements:
      path: Stride/Stride.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
